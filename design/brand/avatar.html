*{margin:0;padding:0;box-sizing:border-box}
html,body{width:512px;height:512px;overflow:hidden}
.stage{
  position:relative;width:512px;height:512px;
  background:
    radial-gradient(340px 340px at 68% 24%, rgba(63,224,174,.16), transparent 62%),

/* strata lines */
.stage::before{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(180deg, transparent 0 46px, rgba(130,152,155,.05) 46px 47px);
}

.stage::after{
  content:"";position:absolute;inset:0;opacity:.055;

}
.drop{
  position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);
  width:300px;height:300px;
  filter:drop-shadow(0 0 34px rgba(63,224,174,.45)) drop-shadow(0 10px 26px rgba(0,0,0,.5));
}
.ring{
  position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);

  border:1.5px solid rgba(63,224,174,.16);
  box-shadow:0 0 60px -18px rgba(63,224,174,.28) inset;

.wm{

  padding-left:.22em; /* balance the trailing tracking */
