name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts (foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: vendor forge-std
        run: git clone --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std
      - name: forge build
        run: forge build --sizes
      - name: forge test
        run: FOUNDRY_PROFILE=ci forge test -vvv

  slither:
    name: slither (static analysis)
    runs-on: ubuntu-latest
    # advisory until M6 hardening locks findings to zero; results still fail
    # loudly in the log for every push
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: vendor forge-std
        run: git clone --depth 1 https://github.com/foundry-rs/forge-std contracts/lib/forge-std
      - uses: crytic/slither-action@v0.4.1
        with:
          target: contracts/
          slither-args: --exclude-dependencies --filter-paths "lib/"
          fail-on: medium

  preflight:
    name: on-chain preflight (Robinhood Chain mainnet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: verify chain id, contract bytecode, live router quote
        run: pnpm --filter @quiver/web preflight

  node:
    name: web + indexer + keeper (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm -r lint
      - name: typecheck
        run: pnpm -r typecheck
      - name: build
        run: pnpm -r build
